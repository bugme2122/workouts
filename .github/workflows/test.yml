name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  client:
    name: client (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  server:
    name: server (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npx vitest run
        working-directory: server
        env:
          JWT_SECRET: ci-secret-not-used-in-prod
